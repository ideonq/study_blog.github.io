<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCU C-IDE | C언어 온라인 개발환경</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* 헤더 */
        .header {
            background: #2d2d30;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #569cd6;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .run-btn, .clear-btn, .sample-btn {
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .run-btn {
            background: #28a745;
            color: white;
        }

        .run-btn:hover {
            background: #218838;
        }

        .run-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #6c757d;
            color: white;
        }

        .clear-btn:hover {
            background: #5a6268;
        }

        .sample-btn {
            background: #0078d4;
            color: white;
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
        }

        .sample-btn:hover {
            background: #106ebe;
        }

        .samples {
            display: flex;
            gap: 0.5rem;
        }

        /* 메인 레이아웃 */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 에디터 */
        .editor-container {
            flex: 1;
            position: relative;
        }

        .editor-header {
            background: #37373d;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #3e3e42;
            font-size: 0.9rem;
            color: #cccccc;
        }

        .editor-with-numbers {
            display: flex;
            height: calc(100% - 40px);
            background: #1e1e1e;
        }

        .line-numbers {
            background: #1e1e1e;
            color: #858585;
            padding: 1rem 0.5rem 1rem 1rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            text-align: right;
            min-width: 50px;
            user-select: none;
            border-right: 1px solid #3e3e42;
            overflow: hidden;
        }

        .code-editor {
            flex: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            tab-size: 4;
        }

        .code-editor:focus {
            background: #252526;
        }

        /* 오류 분석 창 */
        .analysis-container {
            height: 200px;
            border-top: 1px solid #3e3e42;
        }

        .analysis-header {
            background: #37373d;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #3e3e42;
            font-size: 0.9rem;
            color: #cccccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .analysis-area {
            width: 100%;
            height: calc(100% - 40px);
            background: #0a0a0f;
            color: #ffffff;
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* 출력창 */
        .output-container {
            flex: 1;
        }

        .output-header {
            background: #37373d;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #3e3e42;
            font-size: 0.9rem;
            color: #cccccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-area {
            width: 100%;
            height: calc(100% - 40px);
            background: #0c0c0c;
            color: #ffffff;
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .input-section {
            background: #1a1a1a;
            padding: 0.5rem;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .input-label {
            color: #cccccc;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .input-field {
            width: 100%;
            background: #2d2d30;
            color: #ffffff;
            border: 1px solid #3e3e42;
            padding: 0.3rem;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
        }

        .input-field:focus {
            outline: none;
            border-color: #007acc;
        }

        /* 색상 정의 */
        .error-output {
            color: #f85149;
        }

        .success-output {
            color: #56d364;
        }

        .warning-output {
            color: #ffa500;
        }

        .info-output {
            color: #58a6ff;
        }

        .suggestion-output {
            color: #7ee787;
            font-style: italic;
        }

        /* 상태 바 */
        .status-bar {
            background: #007acc;
            color: white;
            padding: 0.25rem 1rem;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 로딩 애니메이션 */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .left-panel {
                border-right: none;
                border-bottom: 1px solid #3e3e42;
            }

            .analysis-container {
                height: 120px;
            }

            .header-controls {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div class="header">
        <a href="index.html" class="logo">DCU C-IDE</a>
        <div class="header-controls">
            <div class="samples">
                <button class="sample-btn" onclick="loadSample('hello')">Hello World</button>
                <button class="sample-btn" onclick="loadSample('calculator')">계산기</button>
                <button class="sample-btn" onclick="loadSample('array')">배열</button>
            </div>
            <button class="clear-btn" onclick="clearAll()">전체 지우기</button>
            <button class="run-btn" id="runBtn" onclick="runCode()">▶ 실행</button>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        <!-- 왼쪽 패널 (에디터 + 오류분석) -->
        <div class="left-panel">
            <!-- 코드 에디터 -->
            <div class="editor-container">
                <div class="editor-header">
                    📝 main.c
                </div>
                <div class="editor-with-numbers">
                    <div class="line-numbers" id="lineNumbers">1</div>
                    <textarea class="code-editor" id="codeEditor" placeholder="여기에 C 코드를 입력하세요...">#include <stdio.h>

int main() {
    printf("Hello, DCU!\n");
    return 0;
}</textarea>
                </div>
            </div>

            <!-- 오류 분석창 -->
            <div class="analysis-container">
                <div class="analysis-header">
                    🤖 AI 코드 분석
                    <button class="clear-btn" onclick="clearAnalysis()">분석 지우기</button>
                </div>
                <div class="analysis-area" id="analysisArea">AI가 코드를 분석하여 오류와 개선점을 알려드립니다.
'실행' 버튼을 눌러 코드 분석을 시작하세요!</div>
            </div>
        </div>

        <!-- 오른쪽 패널 (출력) -->
        <div class="right-panel">
            <div class="output-container">
                <div class="output-header">
                    📺 실행 결과
                    <button class="clear-btn" onclick="clearOutput()">출력 지우기</button>
                </div>
                <div class="output-area" id="outputArea">DCU C-IDE에 오신 것을 환영합니다!

🤖 AI 코드 분석 기능:
- 문법 오류 자동 검출
- 개선 사항 제안
- 실시간 코드 품질 분석

🔧 사용법:
- 좌측에 C 코드 작성
- '실행' 버튼으로 분석 및 실행
- Ctrl+Enter로 빠른 실행</div>
            </div>
        </div>
    </div>

    <!-- 상태 바 -->
    <div class="status-bar">
        <span id="statusText">AI 코드 분석 IDE 준비 완료</span>
        <span id="statusTime"></span>
    </div>

    <script>
        // 전역 변수
        var codeEditor = document.getElementById('codeEditor');
        var lineNumbers = document.getElementById('lineNumbers');
        var analysisArea = document.getElementById('analysisArea');
        var outputArea = document.getElementById('outputArea');
        var runBtn = document.getElementById('runBtn');
        var statusText = document.getElementById('statusText');
        var statusTime = document.getElementById('statusTime');
        var inputData = '';

        // 줄 번호 업데이트
        function updateLineNumbers() {
            var lines = codeEditor.value.split('\n').length;
            var numbers = [];
            for (var i = 1; i <= lines; i++) {
                numbers.push(i);
            }
            lineNumbers.textContent = numbers.join('\n');
        }

        // 스크롤 동기화
        function syncScroll() {
            lineNumbers.scrollTop = codeEditor.scrollTop;
        }

        // 상태 업데이트
        function setStatus(text, isError) {
            statusText.textContent = text;
            statusText.style.color = isError ? '#f85149' : '#ffffff';
            statusTime.textContent = new Date().toLocaleTimeString();
        }

        // 코드 오류 분석 AI
        function analyzeCode(code) {
            var result = '';
            var errorCount = 0;
            var warningCount = 0;
            var lines = code.split('\n');
            
            result += '🔍 AI 코드 분석 결과:\n';
            result += '━━━━━━━━━━━━━━━━━━━━━━━━\n\n';
            
            // 각 줄 분석
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                var lineNum = i + 1;
                
                // 세미콜론 검사
                if (line.length > 0 && 
                    !line.endsWith(';') && 
                    !line.endsWith('{') && 
                    !line.endsWith('}') && 
                    !line.startsWith('#') &&
                    !line.startsWith('//') &&
                    line.indexOf('if') === -1 &&
                    line.indexOf('else') === -1 &&
                    line.indexOf('while') === -1 &&
                    line.indexOf('for') === -1 &&
                    (line.indexOf('printf') !== -1 || 
                     line.indexOf('scanf') !== -1 || 
                     line.indexOf('=') !== -1 ||
                     line.indexOf('int ') !== -1)) {
                    result += '❌ 라인 ' + lineNum + ': 세미콜론 누락\n';
                    result += '   💡 해결: "' + line + ';" 로 수정하세요\n\n';
                    errorCount++;
                }
                
                // printf 검사
                if (line.indexOf('printf') !== -1 && line.indexOf('"') === -1) {
                    result += '❌ 라인 ' + lineNum + ': printf 문법 오류\n';
                    result += '   💡 해결: printf("출력 내용"); 형태로 작성하세요\n\n';
                    errorCount++;
                }
                
                // scanf 검사
                if (line.indexOf('scanf') !== -1 && line.indexOf('&') === -1 && line.indexOf('%d') !== -1) {
                    result += '⚠️ 라인 ' + lineNum + ': scanf에 & 누락 가능성\n';
                    result += '   💡 권장: scanf("%d", &변수명); 형태를 사용하세요\n\n';
                    warningCount++;
                }
                
                // 괄호 검사
                var openParen = (line.match(/\(/g) || []).length;
                var closeParen = (line.match(/\)/g) || []).length;
                if (openParen !== closeParen && line.indexOf('printf') !== -1) {
                    result += '❌ 라인 ' + lineNum + ': 괄호 불일치\n';
                    result += '   💡 해결: 괄호 개수를 맞춰주세요\n\n';
                    errorCount++;
                }
            }
            
            // include 검사
            if (code.indexOf('#include') === -1) {
                result += '⚠️ 권장사항: #include <stdio.h> 추가\n';
                result += '   💡 stdio.h를 포함하면 printf, scanf 사용 가능\n\n';
                warningCount++;
            }
            
            // main 함수 검사
            if (code.indexOf('main') === -1) {
                result += '❌ 치명적 오류: main 함수가 없습니다\n';
                result += '   💡 해결: int main() { ... } 함수를 추가하세요\n\n';
                errorCount++;
            }
            
            // return 검사
            if (code.indexOf('main') !== -1 && code.indexOf('return') === -1) {
                result += '⚠️ 권장사항: main 함수에 return 0; 추가\n';
                result += '   💡 프로그램 정상 종료를 위해 권장합니다\n\n';
                warningCount++;
            }
            
            // 결과 요약
            result += '━━━━━━━━━━━━━━━━━━━━━━━━\n';
            result += '📊 분석 결과 요약:\n';
            result += '   오류: ' + errorCount + '개\n';
            result += '   경고: ' + warningCount + '개\n\n';
            
            if (errorCount === 0 && warningCount === 0) {
                result += '✅ 완벽합니다! 문제가 발견되지 않았습니다.';
            } else if (errorCount === 0) {
                result += '✅ 문법 오류는 없습니다. 권장사항을 확인해보세요.';
            } else {
                result += '❌ 오류를 수정한 후 다시 실행해보세요.';
            }
            
            return result;
        }

        // 프로그램 실행 시뮬레이션
        function simulateExecution(code) {
            var output = '';
            
            // 입력이 필요한 경우
            if (code.indexOf('scanf') !== -1) {
                if (!inputData) {
                    // 입력 데이터 요청
                    var userInput = prompt('프로그램에서 입력이 필요합니다.\n예) 이름과 나이: 홍길동 25\n\n입력 데이터를 입력하세요:');
                    if (userInput !== null) {
                        inputData = userInput;
                    }
                }
                
                if (inputData) {
                    output += '📥 프로그램 입력:\n' + inputData + '\n\n';
                }
            }
            
            // 출력 시뮬레이션
            var result = '';
            if (code.indexOf('Hello') !== -1) {
                result += 'Hello, DCU!\n';
                if (code.indexOf('IDE') !== -1) {
                    result += 'C언어 온라인 IDE입니다.\n';
                }
            } else if (code.indexOf('계산') !== -1) {
                if (inputData) {
                    result += '계산식을 입력하세요 (예: 10 + 5): 결과: 15\n';
                } else {
                    result += '계산식을 입력하세요 (예: 10 + 5): [입력 대기중]\n';
                }
            } else if (code.indexOf('배열') !== -1) {
                result += '배열 원소: 10 20 30 40 50\n';
                result += '배열의 합: 150\n';
                result += '평균: 30.0\n';
            } else {
                result += '프로그램이 실행되었습니다.\n';
            }
            
            output += '📺 실행 출력:\n' + result;
            return output;
        }

        // 코드 실행
        function runCode() {
            var code = codeEditor.value.trim();
            
            if (!code) {
                setStatus('코드를 입력해주세요', true);
                return;
            }

            // UI 업데이트
            runBtn.disabled = true;
            runBtn.innerHTML = '<div class="loading"></div> 분석 중...';
            setStatus('AI가 코드를 분석하고 있습니다...');
            
            // 분석 및 실행
            setTimeout(function() {
                try {
                    // 1. 코드 분석
                    var analysis = analyzeCode(code);
                    analysisArea.textContent = analysis;
                    
                    // 2. 실행 결과
                    var execution = simulateExecution(code);
                    outputArea.textContent = execution;
                    
                    setStatus('분석 및 실행 완료');
                } catch (error) {
                    setStatus('오류가 발생했습니다', true);
                    analysisArea.textContent = '분석 중 오류가 발생했습니다.';
                } finally {
                    runBtn.disabled = false;
                    runBtn.innerHTML = '▶ 실행';
                }
            }, 1000);
        }

        // 출력 지우기
        function clearOutput() {
            outputArea.textContent = '';
        }

        // 분석 지우기
        function clearAnalysis() {
            analysisArea.textContent = 'AI 코드 분석 결과가 여기에 표시됩니다.';
        }

        // 전체 지우기
        function clearAll() {
            codeEditor.value = '';
            inputData = '';
            clearOutput();
            clearAnalysis();
            updateLineNumbers();
            setStatus('모든 내용이 지워졌습니다');
        }

        // 샘플 코드 로드
        function loadSample(type) {
            var samples = {
                'hello': '#include <stdio.h>\n\nint main() {\n    printf("Hello, DCU!\\n");\n    printf("C언어 온라인 IDE입니다.\\n");\n    return 0;\n}',
                'calculator': '#include <stdio.h>\n\nint main() {\n    int a, b;\n    char op;\n    \n    printf("계산식을 입력하세요 (예: 10 + 5): ");\n    scanf("%d %c %d", &a, &op, &b);\n    \n    switch(op) {\n        case \'+\':\n            printf("결과: %d\\n", a + b);\n            break;\n        case \'-\':\n            printf("결과: %d\\n", a - b);\n            break;\n        case \'*\':\n            printf("결과: %d\\n", a * b);\n            break;\n        case \'/\':\n            if(b != 0)\n                printf("결과: %.2f\\n", (float)a / b);\n            else\n                printf("0으로 나눌 수 없습니다.\\n");\n            break;\n        default:\n            printf("잘못된 연산자입니다.\\n");\n    }\n    \n    return 0;\n}',
                'array': '#include <stdio.h>\n\nint main() {\n    int arr[5] = {10, 20, 30, 40, 50};\n    int sum = 0;\n    \n    printf("배열 원소: ");\n    for(int i = 0; i < 5; i++) {\n        printf("%d ", arr[i]);\n        sum += arr[i];\n    }\n    \n    printf("\\n배열의 합: %d\\n", sum);\n    printf("평균: %.1f\\n", (float)sum / 5);\n    \n    return 0;\n}'
            };

            if (samples[type]) {
                codeEditor.value = samples[type];
                updateLineNumbers();
                setStatus('샘플 코드가 로드되었습니다');
                inputData = '';
            }
        }

        // 키보드 이벤트
        function handleKeyDown(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
            
            if (e.key === 'Tab') {
                e.preventDefault();
                var start = codeEditor.selectionStart;
                var end = codeEditor.selectionEnd;
                codeEditor.value = codeEditor.value.substring(0, start) + '    ' + codeEditor.value.substring(end);
                codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
            }
        }

        // 초기화 및 이벤트 등록
        document.addEventListener('DOMContentLoaded', function() {
            // 이벤트 리스너 등록
            codeEditor.addEventListener('input', updateLineNumbers);
            codeEditor.addEventListener('scroll', syncScroll);
            codeEditor.addEventListener('keydown', handleKeyDown);

            // 초기화
            updateLineNumbers();
            setStatus('AI 코드 분석 IDE 준비 완료');

            // 자동 저장
            var autoSaveTimer;
            codeEditor.addEventListener('input', function() {
                clearTimeout(autoSaveTimer);
                autoSaveTimer = setTimeout(function() {
                    setStatus('자동 저장됨');
                }, 2000);
            });

            // 새로고침 경고
            window.addEventListener('beforeunload', function(e) {
                if (codeEditor.value.trim() !== '') {
                    e.preventDefault();
                    e.returnValue = '작성한 코드가 있습니다. 정말 페이지를 떠나시겠습니까?';
                }
            });
        });
    </script>
