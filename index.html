// 현재 필터
let currentFilter = 'all';

// 페이지 로드 시 동아리 카드 생성
function createClubCards() {
    const grid = document.getElementById('clubsGrid');
    if (!grid) return;
    
    grid.innerHTML = clubsData.map(club => `
        <div class="club-card" data-category="${club.categoryEn}" data-club-id="${club.id}">
            <div class="club-image">${club.icon}</div>
            <div class="club-header">
                <div class="club-icon">${club.icon}</div>
                <span class="club-category">${club.category}</span>
                <h3 class="club-name">${club.name}</h3>
                <p class="club-description">${club.description.length > 120 ? club.description.substring(0, 120) + '...' : club.description}</p>
            </div>
            <div class="club-footer">
                <div class="club-members">${club.fee}</div>
                <span class="club-status">${club.status}</span>
            </div>
        </div>
    `).join('');
    
    // 클릭 이벤트 추가
    document.querySelectorAll('.club-card').forEach(card => {
        card.addEventListener('click', function() {
            const clubId = parseInt(this.dataset.clubId);
            const club = clubsData.find(c => c.id === clubId);
            if (club) showModal(club);
        });
    });
}

// 검색 및 필터링
function filterClubs() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.club-card');
    const emptyState = document.getElementById('emptyState');
    let visibleCount = 0;
    
    cards.forEach(card => {
        const clubId = parseInt(card.dataset.clubId);
        const club = clubsData.find(c => c.id === clubId);
        if (!club) return;
        
        const matchesSearch = !searchTerm || 
            club.name.toLowerCase().includes(searchTerm) ||
            club.description.toLowerCase().includes(searchTerm) ||
            club.category.toLowerCase().includes(searchTerm);
            
        const matchesCategory = currentFilter === 'all' || club.categoryEn === currentFilter;
        
        if (matchesSearch && matchesCategory) {
            card.style.display = 'block';
            visibleCount++;
        } else {
            card.style.display = 'none';
        }
    });
    
    emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
}

// 모달 표시
function showModal(club) {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    const actions = document.getElementById('modalActions');
    
    content.innerHTML = `
        <h2 class="modal-club-name">${club.name}</h2>
        <span class="modal-club-category">${club.category}</span>
        <div class="modal-section">
            <div class="modal-section-title">📝 동아리 소개</div>
            <div class="modal-section-content">${club.description}</div>
        </div>
        <div class="modal-section">
            <div class="modal-section-title">💰 회비 정보</div>
            <div class="modal-section-content">${club.fee}</div>
        </div>
        <div class="modal-section">
            <div class="modal-section-title">📞 연락처</div>
            <div class="modal-section-content">${club.contact}</div>
        </div>
    `;
    
    actions.innerHTML = `
        <button class="modal-btn secondary" onclick="closeModal()">닫기</button>
        ${club.link ? `<a href="${club.link}" target="_blank" class="modal-btn primary">🔗 자세히 보기</a>` : ''}
        <button class="modal-btn primary" onclick="alert('연락처: ${club.contact}')">📞 문의하기</button>
    `;
    
    overlay.classList.add('active');
}

// 모달 닫기
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

// 이벤트 리스너 설정
document.addEventListener('DOMContentLoaded', function() {
    // 동아리 카드 생성
    createClubCards();
    
    // 검색 기능
    document.getElementById('searchInput').addEventListener('input', filterClubs);
    
    // 필터 버튼
    document.querySelectorAll('.filter-tag').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.category;
            filterClubs();
        });
    });
    
    // 동아리 추가 버튼
    document.getElementById('addClubBtn').addEventListener('click', showAddClubModal);
    
    // 모달 닫기
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    
    // ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });
});
